name: CI/CD Pipeline

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets the branch below it, not main,
  # and with `branches: [main]` those PRs ran no CI at all until they were
  # retargeted on merge — which is how a lint break reached the base of a
  # three-deep stack unnoticed. Publishing is gated on `release: published`
  # elsewhere, so the only cost here is runner minutes on lint + test.
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv installs the interpreter itself (UV_PYTHON, else .python-version).
      # setup-python lags new releases: 3.15.0 shipped before its manifest did.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Lint with Ruff
        run: uv run ruff check src tests

      - name: Type checking with MyPy
        run: uv run mypy src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15', '3.15t']
    # Without this uv takes the interpreter from the repo's .python-version, so
    # every leg ran the pinned 3.14t and a "Test (3.10)" passed on a package
    # that could not import on 3.10.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      # uv installs the interpreter itself (UV_PYTHON, else .python-version).
      # setup-python lags new releases: 3.15.0 shipped before its manifest did.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # pydub shells out to ffmpeg for anything that is not raw PCM, so the
      # audio tests that encode and decode for real need it on PATH. The runner
      # image no longer ships it, and the `audio` extra requires it at runtime
      # anyway — mocking it here would only hide that.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Report the interpreter under test
        run: uv run python -VV

      - name: Test with pytest
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Everything above runs against uv.lock, which pins exact versions and never
  # travels with the published wheel. That gap shipped a broken 0.8.0: an
  # unbounded `mcp>=1.26.0` resolved to 2.0.0, which had removed
  # mcp.server.fastmcp, so `sanzaru serve` died on import while all six test
  # legs stayed green. This job tests RESOLUTION rather than code — build the
  # wheel, install it into a clean environment with no lock file, and import
  # the entrypoint the way a new user would.
  install:
    name: Install from wheel (no lockfile, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported: resolution is what breaks at the edges.
        python-version: ['3.11', '3.15']
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      # uv installs the interpreter itself (UV_PYTHON, else .python-version).
      # setup-python lags new releases: 3.15.0 shipped before its manifest did.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        run: uv build --wheel

      - name: Install it into a clean venv, resolving dependencies freely
        run: |
          uv venv /tmp/fresh
          # --no-sources / no lock: resolve from the wheel's own metadata, which
          # is all a PyPI user gets.
          uv pip install --python /tmp/fresh/bin/python dist/*.whl

      - name: Report what resolved
        run: /tmp/fresh/bin/python -m pip list 2>/dev/null || uv pip list --python /tmp/fresh/bin/python

      - name: The base install carries no MCP stack
        run: |
          if uv pip list --python /tmp/fresh/bin/python | grep -iE '^(mcp|starlette|uvicorn) '; then
            echo "::error::the base install pulled in the MCP stack; it belongs in the [mcp] extra"
            exit 1
          fi

      - name: Bare `sanzaru` without the extra says how to install it
        run: |
          set +e
          /tmp/fresh/bin/sanzaru 2> /tmp/stderr.txt
          code=$?
          cat /tmp/stderr.txt
          [ "$code" = 3 ] && grep -q 'sanzaru\[mcp\]' /tmp/stderr.txt

      - name: Install the mcp extra into a second clean venv
        run: |
          uv venv /tmp/fresh-mcp
          uv pip install --python /tmp/fresh-mcp/bin/python "$(ls dist/*.whl)[mcp]"

      - name: Import the server entrypoint
        # The CLI lazy-imports the server, so `--help` passes even when the MCP
        # server is unimportable. Import server.py directly — that is the failure
        # a Claude Desktop user actually hits.
        run: /tmp/fresh-mcp/bin/python -c "import sanzaru.server; print('sanzaru.server imports OK')"

      - name: Smoke the console script
        run: /tmp/fresh/bin/sanzaru --help > /dev/null && echo "sanzaru --help OK"

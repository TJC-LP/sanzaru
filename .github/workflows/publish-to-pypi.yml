name: Publish to PyPI

on:
  release:
    types: [published]  # Trigger when a release is published (manual or automatic)

permissions:
  id-token: write  # Required for PyPI trusted publishing

jobs:
  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sanzaru
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # uv builds on the interpreter from .python-version, so setup-python only
      # added a version label that was not the one in use.
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
